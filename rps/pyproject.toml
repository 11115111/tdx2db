[project]
name = "rps"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["duckdb>=0.10", "pandas>=2.0", "pyyaml>=6.0", "click>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["rps*"]
